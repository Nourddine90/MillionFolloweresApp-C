<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef08a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#facc15;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- خلفية دائرية بتدرج برتقالي-أحمر -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  
  <!-- نجمة كبيرة في المنتصف -->
  <polygon points="256,60 295,180 420,180 320,250 360,370 256,300 152,370 192,250 92,180 217,180" fill="url(#starGrad)" stroke="#fff" stroke-width="8"/>
  
  <!-- دوائر صغيرة حول النجمة تمثل التفاعل والمشاركة -->
  <circle cx="128" cy="128" r="25" fill="#fff" opacity="0.8"/>
  <text x="128" y="138" text-anchor="middle" font-size="28" font-weight="bold" fill="#f97316">➕</text>
  
  <circle cx="384" cy="128" r="25" fill="#fff" opacity="0.8"/>
  <text x="384" y="138" text-anchor="middle" font-size="28" font-weight="bold" fill="#f97316">👥</text>
  
  <circle cx="128" cy="384" r="25" fill="#fff" opacity="0.8"/>
  <text x="128" y="394" text-anchor="middle" font-size="28" font-weight="bold" fill="#f97316">📈</text>
  
  <circle cx="384" cy="384" r="25" fill="#fff" opacity="0.8"/>
  <text x="384" y="394" text-anchor="middle" font-size="28" font-weight="bold" fill="#f97316">🚀</text>
  
  <!-- نص N في الأسفل -->
  <circle cx="256" cy="450" r="35" fill="#fff" opacity="0.9"/>
  <text x="256" y="462" text-anchor="middle" font-size="40" font-weight="bold" fill="#f97316">N</text>
</svg>
